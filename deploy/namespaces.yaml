# The two namespaces this bundle uses. The Cloudflare Tunnel plugin looks for the manager,
# its ConfigMap, cloudflared and the TunnelRoutes in cloudflare-tunnel.
#   cloudflare-tunnel   cloudflared (the tunnel connector) and cloudflare-tunnel-manager
#   headlamp            Headlamp
# Both enforce the `restricted` Pod Security Standard and start default-deny.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-tunnel
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
