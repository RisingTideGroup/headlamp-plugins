# Every plugin under plugins/: install, audit, typecheck, lint, test, build. deploy/: the
# rendered install.yaml must match its sources and pass the Kubernetes schemas.
# On main (or by hand), after all of that passes, publish:
#   ghcr.io/<owner>/headlamp-plugins:<main|sha-…>   all plugins, for an initContainer
#   ghcr.io/<owner>/headlamp:<HEADLAMP_TAG>          Headlamp (headlamp.env) with them baked in
#                                                    (+ an immutable <tag>-<headlamp7>-<plugins7>)
# So a change to any plugin, or to headlamp.env, rebuilds the Headlamp image.
#
# Headlamp's Dockerfile copies its build context's .plugins/ into /headlamp/plugins; the
# built plugins are dropped there before the image build.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          plugins=$(find plugins -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' | xargs -n1 basename | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "$plugins"

  manifests:
    name: deploy/ (install.yaml up to date, schemas valid)
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.34.1
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl and kubeconform
        run: |
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
      - name: install.yaml matches deploy/
        run: |
          { echo "# GENERATED by: kubectl kustomize deploy > deploy/install.yaml — edit the files in deploy/, not this."; ./kubectl kustomize deploy; } > rendered.yaml
          diff -u deploy/install.yaml rendered.yaml || { echo "::error::deploy/install.yaml is stale; regenerate it"; exit 1; }
      - name: Validate
        run: |
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/install.yaml

  plugin:
    needs: discover
    name: plugin (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: npm audit (fails on moderate and above)
        run: npm audit --audit-level=moderate
      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Stage the built plugin
        run: |
          mkdir -p "$RUNNER_TEMP/out/${{ matrix.plugin }}"
          cp dist/main.js package.json "$RUNNER_TEMP/out/${{ matrix.plugin }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.plugin }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  images:
    needs: plugin
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins-repo
      - name: Read headlamp.env
        run: |
          set -a; . plugins-repo/headlamp.env; set +a
          [[ "$HEADLAMP_REPO" =~ ^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::bad HEADLAMP_REPO"; exit 1; }
          [[ "$HEADLAMP_REF" =~ ^[A-Za-z0-9._/-]{1,128}$ ]] || { echo "::error::bad HEADLAMP_REF"; exit 1; }
          [[ "$HEADLAMP_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad HEADLAMP_TAG"; exit 1; }
          { echo "HEADLAMP_REPO=$HEADLAMP_REPO"; echo "HEADLAMP_REF=$HEADLAMP_REF"; echo "HEADLAMP_TAG=$HEADLAMP_TAG"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HEADLAMP_REPO }}
          ref: ${{ env.HEADLAMP_REF }}
          path: headlamp
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: built
      - name: Drop the plugins into Headlamp's .plugins/
        run: |
          mkdir -p headlamp/.plugins
          cp -R built/. headlamp/.plugins/
          find headlamp/.plugins -type f
      - name: Names and tags
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/headlamp" >> "$GITHUB_ENV"
          echo "BUNDLE=ghcr.io/$owner/headlamp-plugins" >> "$GITHUB_ENV"
          echo "HEADLAMP_SHA=$(git -C headlamp rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PIN=${HEADLAMP_TAG}-$(git -C headlamp rev-parse --short=7 HEAD)-$(git -C plugins-repo rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the plugins image
        uses: docker/build-push-action@v6
        with:
          context: plugins-repo
          file: plugins-repo/Dockerfile.plugins
          build-contexts: plugins=built
          push: true
          tags: |
            ${{ env.BUNDLE }}:main
            ${{ env.BUNDLE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Headlamp (with the plugins)
        uses: docker/build-push-action@v6
        with:
          context: headlamp
          file: headlamp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.HEADLAMP_TAG }}
            ${{ env.IMAGE }}:${{ env.PIN }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.risingtidegroup.headlamp.repository=${{ env.HEADLAMP_REPO }}
            com.risingtidegroup.headlamp.revision=${{ env.HEADLAMP_SHA }}
      - name: Check the plugins are in the image; runtime uid
        run: |
          docker run --rm --entrypoint ls "${IMAGE}:${HEADLAMP_TAG}" -R /headlamp/plugins
          docker run --rm --entrypoint id "${IMAGE}:${HEADLAMP_TAG}"
