# Every plugin under plugins/: install, audit, typecheck, lint, test, build. Every backend under
# backends/ (e.g. cloudflare-tunnel-manager): install, audit, typecheck, test, image build, start
# check, Trivy; published as ghcr.io/<owner>/<backend>:<main|sha-…> on main. deploy/: the
# rendered install.yaml must match its sources, pass the Kubernetes schemas and the CRD checks.
# Headlamp (headlamp.env): its backend tests run on the exact commit being built.
# Then both images are built, the Headlamp image is started and must list every plugin,
# and both are Trivy-scanned (MEDIUM or higher fails). Only on main (or by hand), after
# all of that passes, are they published:
#   ghcr.io/<owner>/headlamp-plugins:<main|sha-…>   all plugins, for an initContainer
#   ghcr.io/<owner>/headlamp:<HEADLAMP_TAG>          Headlamp (headlamp.env) with them baked in
#                                                    (+ an immutable <tag>-<headlamp7>-<plugins7>)
# Pull requests run everything except the publish.
#
# Headlamp's Dockerfile copies its build context's .plugins/ into /headlamp/plugins; the
# built plugins are dropped there before the image build.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Trivy release binary pinned by SHA-256 (no third-party Action).
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      backends: ${{ steps.list.outputs.backends }}
      headlamp_repo: ${{ steps.env.outputs.HEADLAMP_REPO }}
      headlamp_ref: ${{ steps.env.outputs.HEADLAMP_REF }}
      headlamp_tag: ${{ steps.env.outputs.HEADLAMP_TAG }}
      headlamp_sha: ${{ steps.env.outputs.HEADLAMP_SHA }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          plugins=$(find plugins -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' | xargs -n1 basename | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "$plugins"
          backends=$(find backends -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null | xargs -rn1 basename | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "backends=$backends" >> "$GITHUB_OUTPUT"
          echo "$backends"
      - name: Read headlamp.env; resolve the ref to one commit
        id: env
        run: |
          set -a; . ./headlamp.env; set +a
          [[ "$HEADLAMP_REPO" =~ ^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::bad HEADLAMP_REPO"; exit 1; }
          [[ "$HEADLAMP_REF" =~ ^[A-Za-z0-9._/-]{1,128}$ ]] || { echo "::error::bad HEADLAMP_REF"; exit 1; }
          [[ "$HEADLAMP_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$ ]] || { echo "::error::bad HEADLAMP_TAG"; exit 1; }
          # One commit for the whole run, so the tests and the image use the same code
          # even if the branch moves mid-run.
          sha=$(git ls-remote "https://github.com/$HEADLAMP_REPO" "refs/heads/$HEADLAMP_REF" "refs/tags/$HEADLAMP_REF" | head -1 | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$HEADLAMP_REF not found in $HEADLAMP_REPO"; exit 1; }
          { echo "HEADLAMP_REPO=$HEADLAMP_REPO"; echo "HEADLAMP_REF=$HEADLAMP_REF"; echo "HEADLAMP_TAG=$HEADLAMP_TAG"; echo "HEADLAMP_SHA=$sha"; } | tee -a "$GITHUB_OUTPUT"

  manifests:
    name: deploy/ (install.yaml up to date, schemas valid)
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.34.1
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v7
      - name: Install kubectl and kubeconform
        run: |
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
      - name: install.yaml matches deploy/
        run: |
          { echo "# GENERATED by: kubectl kustomize deploy > deploy/install.yaml — edit the files in deploy/, not this."; ./kubectl kustomize deploy; } > rendered.yaml
          diff -u deploy/install.yaml rendered.yaml || { echo "::error::deploy/install.yaml is stale; regenerate it"; exit 1; }
      - name: Validate
        run: |
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/install.yaml
      - name: TunnelRoute CRD only routes to cluster Services
        run: |
          python3 - <<'PY'
          import re, yaml
          docs = [d for d in yaml.safe_load_all(open('deploy/install.yaml')) if d]
          crd = next(d for d in docs if d['kind'] == 'CustomResourceDefinition')
          v = crd['spec']['versions'][0]
          assert crd['metadata']['name'] == 'tunnelroutes.tunnel.risingtidegroup.github.io'
          assert v['subresources'] == {'status': {}}
          props = v['schema']['openAPIV3Schema']['properties']['spec']['properties']
          host, svc = re.compile(props['hostname']['pattern']), re.compile(props['service']['pattern'])
          assert host.match('portal.example.com') and host.match('*.example.com') and not host.match('Bad_Host')
          assert svc.match('http://portal.apps.svc.cluster.local:3000') and svc.match('http_status:404')
          assert not svc.match('http://evil.example.com:80') and not svc.match('http://169.254.169.254:80')
          print('CRD ok')
          PY

  backend:
    needs: discover
    if: needs.discover.outputs.backends != '[]'
    name: backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.discover.outputs.backends) }}
    env:
      DIR: backends/${{ matrix.backend }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install, audit, typecheck, test
        working-directory: ${{ env.DIR }}
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.backend }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DIR }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: "Start check: non-root, and exits cleanly outside a cluster"
        run: |
          set -uo pipefail
          uid=$(docker run --rm --entrypoint id "$IMAGE:main" -u)
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }
          # Steps run under bash -e; capture the expected non-zero exit instead of aborting on it.
          code=0; out=$(docker run --rm "$IMAGE:main" 2>&1) || code=$?
          echo "$out"
          [ "$code" = 2 ] && grep -q 'not running in a cluster' <<<"$out" || { echo "::error::expected exit 2 'not running in a cluster', got $code"; exit 1; }
      - name: Install Trivy (pinned binary)
        run: |
          bin="$RUNNER_TEMP/trivy"; mkdir -p "$bin"
          curl -sSfL -o "$bin/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $bin/trivy.tgz" | sha256sum -c -
          tar -xzf "$bin/trivy.tgz" -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
      - name: Trivy (MEDIUM or higher fails)
        run: |
          args=(image --scanners vuln --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --image-src docker)
          if [ -f .trivyignore ]; then args+=(--ignorefile .trivyignore); fi
          trivy "${args[@]}" "$IMAGE:main"
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-${{ github.sha }}"

  plugin:
    needs: discover
    name: plugin (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: npm audit (fails on moderate and above)
        run: npm audit --audit-level=moderate
      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Headlamp loads <name>/main.js + <name>/package.json. A plugin built without the
      # headlamp-plugin CLI writes its own dist/package.json (Headlamp refuses one whose
      # devDependencies lack @kinvolk/headlamp-plugin); otherwise the source package.json ships.
      - name: Stage the built plugin
        run: |
          out="$RUNNER_TEMP/out/${{ matrix.plugin }}"
          mkdir -p "$out"
          cp dist/main.js "$out/"
          if [ -f dist/package.json ]; then cp dist/package.json "$out/"; else cp package.json "$out/"; fi
          node -e 'const p=require(process.argv[1]); if(!p.devDependencies?.["@kinvolk/headlamp-plugin"]){console.error("::error::package.json lacks devDependencies[\"@kinvolk/headlamp-plugin\"]; Headlamp will not load it");process.exit(1)}' "$out/package.json"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.plugin }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  # headlamp.env may point at unreleased upstream code: test it here before shipping it.
  headlamp-backend:
    needs: discover
    name: headlamp backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.discover.outputs.headlamp_repo }}
          ref: ${{ needs.discover.outputs.headlamp_sha }}
          path: headlamp
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: headlamp/backend/go.mod
          cache-dependency-path: headlamp/backend/go.sum
      - name: go vet + go test
        working-directory: headlamp/backend
        run: |
          go vet ./...
          go test ./...

  images:
    needs: [discover, manifests, plugin, headlamp-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HEADLAMP_REPO: ${{ needs.discover.outputs.headlamp_repo }}
      HEADLAMP_SHA: ${{ needs.discover.outputs.headlamp_sha }}
      HEADLAMP_TAG: ${{ needs.discover.outputs.headlamp_tag }}
      PLUGINS: ${{ needs.discover.outputs.plugins }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugins-repo
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HEADLAMP_REPO }}
          ref: ${{ env.HEADLAMP_SHA }}
          path: headlamp
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: plugin-*
          merge-multiple: true
          path: built
      - name: Drop the plugins into Headlamp's .plugins/
        run: |
          mkdir -p headlamp/.plugins
          cp -R built/. headlamp/.plugins/
          find headlamp/.plugins -type f
      - name: Names and tags
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/headlamp" >> "$GITHUB_ENV"
          echo "BUNDLE=ghcr.io/$owner/headlamp-plugins" >> "$GITHUB_ENV"
          echo "PIN=${HEADLAMP_TAG}-${HEADLAMP_SHA::7}-$(git -C plugins-repo rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build the plugins image
        uses: docker/build-push-action@v7
        with:
          context: plugins-repo
          file: plugins-repo/Dockerfile.plugins
          build-contexts: plugins=built
          load: true
          push: false
          tags: |
            ${{ env.BUNDLE }}:main
            ${{ env.BUNDLE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build Headlamp (with the plugins)
        uses: docker/build-push-action@v7
        with:
          context: headlamp
          file: headlamp/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.HEADLAMP_TAG }}
            ${{ env.IMAGE }}:${{ env.PIN }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.risingtidegroup.headlamp.repository=${{ env.HEADLAMP_REPO }}
            com.risingtidegroup.headlamp.revision=${{ env.HEADLAMP_SHA }}

      - name: "Smoke test: Headlamp starts as non-root and serves every plugin"
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "$IMAGE:$HEADLAMP_TAG" -u)
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }
          docker run -d --name headlamp -p 127.0.0.1:4466:4466 "$IMAGE:$HEADLAMP_TAG"
          ok=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4466/plugins -o plugins.json; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { docker logs headlamp; echo "::error::Headlamp did not answer /plugins within 60s"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:4466/ || { echo "::error::frontend not served"; exit 1; }
          echo "/plugins:"; jq . plugins.json
          for p in $(echo "$PLUGINS" | jq -r '.[]'); do
            jq -e --arg d "$p" 'any(.[]; .name == $d or (.path | endswith("/" + $d)))' plugins.json >/dev/null \
              || { docker logs headlamp; echo "::error::plugin $p not served by Headlamp"; exit 1; }
            curl -fsS -o /dev/null "http://127.0.0.1:4466/plugins/$p/main.js" \
              || { echo "::error::plugins/$p/main.js not served"; exit 1; }
          done
          docker rm -f headlamp

      - name: Install Trivy (pinned binary)
        run: |
          bin="$RUNNER_TEMP/trivy"; mkdir -p "$bin"
          curl -sSfL -o "$bin/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $bin/trivy.tgz" | sha256sum -c -
          tar -xzf "$bin/trivy.tgz" -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
      - name: Trivy (MEDIUM or higher fails)
        run: |
          args=(image --scanners vuln --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --image-src docker)
          if [ -f plugins-repo/.trivyignore ]; then args+=(--ignorefile plugins-repo/.trivyignore); fi
          trivy "${args[@]}" "$IMAGE:$HEADLAMP_TAG"
          trivy "${args[@]}" "$BUNDLE:main"

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          docker push "$BUNDLE:main"
          docker push "$BUNDLE:sha-${{ github.sha }}"
          docker push "$IMAGE:$HEADLAMP_TAG"
          docker push "$IMAGE:$PIN"
