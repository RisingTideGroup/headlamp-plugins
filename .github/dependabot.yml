# Weekly dependency updates: each plugin's and backend's npm tree, the backends' base images,
# and the workflow actions.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /plugins/*
      - /backends/*
    schedule:
      interval: weekly
    # Plugins compile against the React and MUI that Headlamp hands them at runtime
    # (pluginLib: React 18, MUI 5 in Headlamp 0.46). Their majors move only when Headlamp's do.
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@mui/material"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /backends/*
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
